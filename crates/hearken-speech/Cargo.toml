[package]
name = "hearken-speech"
description = "Screen reader, braille and text-to-speech output for audio games, through Prism"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Publishes Prism's link arguments to games (see build.rs).
links = "hearken_speech"
build = "build.rs"

[features]
# The built-in voice (genny's formant synth through the sound device), for
# players with no screen reader or speech engine. See `builtin`.
genny-voice = ["dep:hearken-genny", "dep:cpal"]

[dependencies]
prismer.workspace = true
hearken-genny = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
log.workspace = true
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "builtin_voice_watch"
required-features = ["genny-voice"]
