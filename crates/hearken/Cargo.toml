[package]
name = "hearken"
description = "Hearken: the one dependency for an audio-first, screen-reader-first game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Republishes Prism's link arguments under this crate's name (see build.rs).
links = "hearken"

[features]
default = ["kira", "testing"]
kira = ["hearken-app/kira"]
# `hearken::Headless` and `hearken::testing`, for a game's own tests.
testing = ["hearken-app/testing"]
# `--agent-server`, the MCP server an agent plays the real game through. Turn
# it on from the game's own `agent-server` feature, so release builds drop it.
agent-server = ["hearken-app/agent-server"]
# Internet radio: `hearken::radio::Stream`.
radio = ["dep:hearken-radio"]
# HE-AAC for radio, through Fraunhofer's FDK AAC; read the README's licence notes first.
fdk-aac = ["radio", "hearken-radio/fdk-aac"]
# AI commentary voices (Kokoro through local-tts and ONNX Runtime):
# `hearken::voice`. Adds ONNX Runtime to the build; off by default.
voice = ["dep:hearken-voice", "hearken-voice/voice"]

[dependencies]
hearken-app.workspace = true
hearken-radio = { workspace = true, optional = true }
hearken-voice = { workspace = true, optional = true }
# A direct dependency, so build.rs sees Prism's link arguments.
hearken-speech.workspace = true
