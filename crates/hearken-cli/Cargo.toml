[package]
name = "hearken-cli"
description = "The hearken command: download, or build, and start a Hearken game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "hearken"
path = "src/main.rs"

[dependencies]
dirs.workspace = true
# Writes a release's sounds.pak; the engine reads it.
hearken-pack.workspace = true
# Makes a game's seal key and its ID; the engine seals with it.
hearken-seal.workspace = true
serde_json.workspace = true
ureq = { workspace = true, features = ["json"] }

[dev-dependencies]
tempfile.workspace = true
