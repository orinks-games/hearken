[package]
name = "hearken-app"
description = "The shell of an audio-first game: screens, menus, input, settings, speech"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[features]
default = ["kira"]
kira = ["hearken-audio/kira"]

[dependencies]
hearken-speech.workspace = true
hearken-audio.workspace = true
hearken-synth.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
sdl2.workspace = true
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sdl2 = { workspace = true, features = ["bundled", "static-link"] }

[target.'cfg(target_os = "linux")'.dependencies]
sdl2 = { workspace = true, features = ["bundled", "static-link"] }
