[package]
name = "hearken-app"
description = "The shell of an audio-first game: screens, menus, input, settings, speech"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[features]
default = ["kira", "testing"]
kira = ["hearken-audio/kira"]
# `Headless`, the in-memory app a game's tests drive. A game that tests
# through its own harness turns default features off and skips `tempfile`.
testing = ["dep:tempfile"]
# `--agent-server`: an MCP server in the real game, so an agent can play it
# by ear (see `agent_server`). For developer builds; `hearken release`
# leaves a game's `agent-server` feature out.
agent-server = []

[dependencies]
hearken-speech.workspace = true
hearken-audio.workspace = true
hearken-synth.workspace = true
# Sealed data files (`ctx.vault`) for releases built with `seal = true`.
hearken-seal.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
tempfile = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
sdl2.workspace = true
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sdl2 = { workspace = true, features = ["bundled", "static-link"] }

[target.'cfg(target_os = "linux")'.dependencies]
sdl2 = { workspace = true, features = ["bundled", "static-link"] }

[target.'cfg(target_os = "ios")'.dependencies]
sdl2 = { workspace = true, features = ["bundled", "static-link"] }

[dev-dependencies]
tempfile.workspace = true
