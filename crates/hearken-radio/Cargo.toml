[package]
name = "hearken-radio"
description = "Internet radio for audio games: HTTP and ICY stations, playlists and live HLS, played as a Hearken feed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Fraunhofer's FDK AAC in place of Symphonia's AAC: it decodes HE-AAC, which
# Symphonia's does not. Opt-in because Fraunhofer's licence permits use only
# under AAC patent licences the game holds (see the README).
fdk-aac = ["dep:symphonia-adapter-fdk-aac"]

[dependencies]
# Gzipped HLS playlists: a long live window's text re-read every segment.
flate2 = "1"
hearken-audio.workspace = true
icy-metadata.workspace = true
log.workspace = true
m3u8-rs.workspace = true
mpeg2ts.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
# AAC also registers Symphonia's ADTS reader, the format most AAC stations send;
# isomp4 reads fMP4 (CMAF) HLS segments.
symphonia = { workspace = true, features = ["aac", "isomp4"] }
symphonia-adapter-fdk-aac = { workspace = true, optional = true }
symphonia-adapter-libopus.workspace = true
ureq.workspace = true
url.workspace = true

# The system's own AAC decoder, which decodes HE-AAC (see src/system_aac).
[target.'cfg(windows)'.dependencies]
# symphonia-core directly: its codec-description macros name it.
symphonia-core.workspace = true
windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
symphonia-core.workspace = true
objc2-audio-toolbox.workspace = true
objc2-core-audio-types.workspace = true
