[package]
name = "hearken-audio"
description = "Sound for audio games: a pool of positioned sounds, buses and live voices over any audio library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["kira"]
kira = ["dep:kira", "dep:cpal", "dep:rtrb", "dep:symphonia", "dep:symphonia-adapter-libopus"]

[dependencies]
hearken-synth.workspace = true
# A release's sounds.pak (see `PackedClips`).
hearken-pack.workspace = true
kira = { workspace = true, optional = true }
# The output device under Kira, reopened when it changes (see kira/device.rs).
cpal = { workspace = true, optional = true }
rtrb = { workspace = true, optional = true }
log.workspace = true
# AAC in MP4/M4A and AIFF too, for the music files a player brings.
symphonia = { workspace = true, optional = true, features = ["aac", "isomp4", "aiff"] }
symphonia-adapter-libopus = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
