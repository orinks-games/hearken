[package]
name = "hearken-audio"
description = "Sound for audio games: a pool of positioned sounds, buses and live voices over any audio library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["bass"]
bass = ["dep:hearken-bass-sys"]

[dependencies]
hearken-synth.workspace = true
hearken-bass-sys = { workspace = true, optional = true }
log.workspace = true

[dev-dependencies]
tempfile.workspace = true
hearken-bass-sys.workspace = true
