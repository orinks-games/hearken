[package]
name = "hearken-audio"
description = "Sound for audio games: a pool of positioned sounds, buses and live voices over any audio library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["kira"]
kira = ["dep:kira", "dep:symphonia", "dep:symphonia-adapter-libopus"]

[dependencies]
hearken-synth.workspace = true
kira = { workspace = true, optional = true }
log.workspace = true
symphonia = { workspace = true, optional = true }
symphonia-adapter-libopus = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
