name: CI

on:
  # Jobs run on GitHub's hosted runners, free for this public repository
  # (Blacksmith's paid minutes stay with the private ones). Pull requests
  # run fmt and the tests on Windows and Linux; macOS runners are the
  # slowest and fewest at once, so macOS runs only on release tags and
  # workflow_dispatch.
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A new push to a pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The bundled SDL2 source declares a cmake_minimum_required older than
  # CMake 4 accepts; this is CMake's own escape hatch for exactly that.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # sccache caches compiled crates by content, so a toolchain bump or a
  # fresh checkout recompiles only what changed.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-2025","ubuntu-24.04"]' || '["windows-2025","macos-15","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # The runners have no screen reader or voices to test against.
      HEARKEN_TEST_NO_SPEECH: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
      - run: rustup show
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # prism-sys asks CMake for C23. The Windows image's CMake does not map
      # C23 onto MSVC, so use a current CMake that does (/std:clatest).
      - uses: lukka/get-cmake@latest
        if: runner.os == 'Windows'
      # prism-sys's SAPI and screen-reader backends include atlbase.h, and
      # the Windows image ships Visual Studio without the ATL component.
      # Restore ATL from the cache when the MSVC version matches; otherwise
      # add it with the Visual Studio installer and cache it for next time.
      - name: Find the MSVC tools
        id: msvc
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the x64 C++ tools" }
          $ver = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          "vs=$vs" >> $env:GITHUB_OUTPUT
          "ver=$ver" >> $env:GITHUB_OUTPUT
          "atl=$vs\VC\Tools\MSVC\$ver\atlmfc" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v4
        id: atl-cache
        if: runner.os == 'Windows'
        with:
          path: ${{ runner.temp }}/atlmfc
          key: vs-atlmfc-${{ runner.os }}-${{ matrix.os }}-${{ steps.msvc.outputs.ver }}
      - name: Add ATL to Visual Studio
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VS: ${{ steps.msvc.outputs.vs }}
          ATL: ${{ steps.msvc.outputs.atl }}
          CACHED: ${{ runner.temp }}/atlmfc
        run: |
          if (Test-Path "$env:ATL\include\atlbase.h") { Write-Host "ATL already present"; exit 0 }
          if (Test-Path "$env:CACHED\include\atlbase.h") {
            Copy-Item "$env:CACHED" "$env:ATL" -Recurse -Force
            if (Test-Path "$env:ATL\include\atlbase.h") { Write-Host "ATL restored from cache"; exit 0 }
          }
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "modify", "--installPath", "`"$env:VS`"", "--add", "Microsoft.VisualStudio.Component.VC.ATL", "--quiet", "--norestart", "--nocache" -Wait -PassThru
          if ($p.ExitCode -notin 0, 3010) { throw "Visual Studio installer exited $($p.ExitCode)" }
          if (-not (Test-Path "$env:ATL\include\atlbase.h")) { throw "atlbase.h still missing" }
          if (-not (Test-Path "$env:CACHED\include\atlbase.h")) { Copy-Item "$env:ATL" "$env:CACHED" -Recurse -Force }
      - uses: actions/cache/save@v4
        if: runner.os == 'Windows' && steps.atl-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/atlmfc
          key: vs-atlmfc-${{ runner.os }}-${{ matrix.os }}-${{ steps.msvc.outputs.ver }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Feature combinations compile the same everywhere, so they use the
      # cheapest runner.
      - name: Build without Kira
        if: runner.os == 'Linux'
        run: cargo check -p hearken --no-default-features --locked
      # fdk-aac compiles a C codec from source, so pull requests skip it;
      # release tags and manual runs still check it.
      - name: Build with fdk-aac
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: cargo check -p hearken --features fdk-aac --locked
      - name: Tests
        run: cargo test --workspace --locked
      # The agent server is behind a feature no workspace crate turns on, so
      # the run above skips its tests (lockstep among them).
      - name: Agent server tests
        if: runner.os == 'Linux'
        run: cargo test -p hearken-app --features agent-server --lib --locked agent_server
      - name: Agent server clippy
        if: runner.os == 'Linux'
        run: cargo clippy -p hearken-app --features agent-server --all-targets --locked -- -D warnings
      # Discord's real client is behind a feature too. Every runner, since
      # the pipe is a named pipe on Windows and a socket elsewhere.
      - name: Discord tests
        run: cargo test -p hearken-discord --features ipc --locked
      - name: Discord clippy
        run: cargo clippy -p hearken-app --features discord --all-targets --locked -- -D warnings
      # Online play is behind a feature no workspace crate turns on either.
      - name: Online tests
        if: runner.os == 'Linux'
        run: cargo test -p hearken-app --features online --locked
      - name: Online clippy
        if: runner.os == 'Linux'
        run: cargo clippy -p hearken-app --features online --all-targets --locked -- -D warnings

  # Verified runs: the replay crate builds for WebAssembly, and the server
  # library verifies the runs its Rust tests record with the real module.
  # Needs no system libraries, so it skips the desktop dependencies.
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup target add wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test -p hearken-replay --locked
      - run: cargo build -p hearken-replay --example coin-dash --target wasm32-unknown-unknown --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server library tests
        working-directory: server
        env:
          HEARKEN_REQUIRE_WASM: "1"
        run: npm test

  # hearken-voice: local-tts and ONNX Runtime build, Kokoro speaks a line
  # that hearken-audio decodes, the Voice service's tests pass, and a whole
  # game (the template, with the voice features on) links Prism and ONNX
  # Runtime together. Pull requests run Windows and Linux like
  # the tests; a manual run adds macOS. The voice package (92 MB from Hugging
  # Face, pinned by SHA-256) is cached between runs.
  voice:
    name: voice (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-2025","ubuntu-24.04"]' || '["windows-2025","macos-15","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HEARKEN_VOICES: ${{ github.workspace }}/voices
      HEARKEN_VOICE_REQUIRED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
      - run: rustup show
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          key: voice
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: voices
          key: voices-kokoro-en-q8-local-tts-0.7.0
      # One test-profile build serves both the install example and the
      # tests, so the crate compiles once.
      - name: Build
        run: |
          start=$(date +%s)
          cargo test -p hearken-voice --features download --no-run --locked
          echo "VOICE_BUILD_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Install the voice package
        run: target/debug/examples/install voices
      - name: Speak
        run: cargo test -p hearken-voice --features download --locked -- --nocapture --test-threads=1 2>&1 | tee speak.log
      - name: Clippy
        run: cargo clippy -p hearken-voice --features download --all-targets --locked -- -D warnings
      # A game with voices on: the facade's link arguments, Prism and ONNX
      # Runtime in one program. On Windows, DirectML.dll must sit beside it
      # for `hearken release` to ship.
      - name: Build a game with voice
        run: |
          cargo build -p hello-hearken --features hearken/voice-download --locked
          if [ "$RUNNER_OS" = Windows ]; then
            ls target/debug/*.dll
            test -f target/debug/DirectML.dll
          fi
      # Last, so the numbers sit at the end of the log.
      - name: Report
        run: |
          bin=$(find target/debug/deps -maxdepth 1 -type f -name 'kokoro-*' ! -name '*.d' ! -name '*.pdb' | head -1)
          case "$RUNNER_OS" in
            macOS) libs=$(otool -L "$bin") ;;
            *) libs=$(ldd "$bin" || true) ;;
          esac
          echo "$libs"
          shipped=$(find target/debug -maxdepth 2 -iname '*onnxruntime*' | tr '\n' ' ')
          if echo "$libs" | grep -qi onnxruntime; then link=dynamic; else link=static; fi
          {
            echo "VOICE-REPORT $RUNNER_OS"
            echo "VOICE-BUILD ${VOICE_BUILD_S} s (test profile, sccache and rust-cache as restored)"
            echo "VOICE-LINK $link; ONNX Runtime files in target: ${shipped:-none}"
            grep -E '^load:|^warm-up:|VOICE-LATENCY' speak.log
          } | tee -a "$GITHUB_STEP_SUMMARY"
