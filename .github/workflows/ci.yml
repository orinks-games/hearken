name: CI

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # The hosted runner has no screen reader or voices to test against.
      HEARKEN_TEST_NO_SPEECH: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned toolchain
        run: rustup show

      - name: Keep Defender off the build tree
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup" -ErrorAction Stop
            Write-Host "Defender exclusions added."
          } catch {
            Write-Host "Could not add Defender exclusions ($_); building without them."
          }

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build without Kira
        run: cargo check -p hearken --no-default-features --locked

      - name: Tests
        run: cargo test --workspace --locked
