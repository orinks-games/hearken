name: TLS probe (temporary)
on:
  push:
    branches: [claude/project-thread-4c14dx]
    paths: [.github/workflows/zz-tls-probe.yml]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-windows-2025, blacksmith-4vcpu-ubuntu-2404, blacksmith-6vcpu-macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: orinks-games/Freight-Fate
          ref: dev
          path: _ff
          sparse-checkout: data/radio_catalog.json
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      - name: URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('_ff/data/radio_catalog.json'))
          urls = set()
          def walk(x):
              if isinstance(x, dict): [walk(v) for v in x.values()]
              elif isinstance(x, list): [walk(v) for v in x]
              elif isinstance(x, str) and x.startswith('https://'): urls.add(x)
          walk(d)
          open('urls.txt', 'w').write('\n'.join(sorted(urls)))
          print(len(urls))
          PY
      - name: Probe
        shell: bash
        run: URLS_FILE="$PWD/urls.txt" cargo test -p hearken-radio --test zz_probe -- --ignored --nocapture 2>&1 | grep -E "PROBE|ureq:|platform:|SUMMARY"
