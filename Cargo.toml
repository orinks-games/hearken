[workspace]
resolver = "2"
members = ["crates/*", "template"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/orinks-games/hearken"
authors = ["Joshua Tubbs (Orinks)"]

[workspace.dependencies]
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
dirs = "6"
libc = "0.2"
sdl2 = "0.38"
prismer = { version = "0.1.4", features = ["static"] }
hearken-speech = { path = "crates/hearken-speech" }
hearken = { path = "crates/hearken" }
hearken-app = { path = "crates/hearken-app", default-features = false }
hearken-synth = { path = "crates/hearken-synth" }
hearken-pack = { path = "crates/hearken-pack" }
hearken-audio = { path = "crates/hearken-audio", default-features = false }
hearken-radio = { path = "crates/hearken-radio" }
hearken-voice = { path = "crates/hearken-voice" }
kira = { version = "0.12", default-features = false, features = ["cpal", "symphonia"] }
# Kira's own versions: hearken-audio opens the device itself.
cpal = "0.18"
rtrb = "0.4"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm"] }
symphonia-adapter-libopus = "0.3"
symphonia-core = "0.6"
symphonia-adapter-fdk-aac = "0.2"
# The radio's HE-AAC: Media Foundation on Windows, AudioToolbox on macOS.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_LibraryLoader"] }
objc2-audio-toolbox = { version = "0.3", default-features = false, features = ["std", "AudioConverter", "AudioFormat", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs"] }
# The operating system's own certificate check for the radio, as a browser
# does: Windows and macOS fetch an intermediate a station's server leaves out.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.6"
icy-metadata = { version = "0.6", default-features = false }
url = "2"
m3u8-rs = "6"
mpeg2ts = "0.6"
fundsp = { version = "0.23", default-features = false, features = ["std"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 0

[profile.test]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
